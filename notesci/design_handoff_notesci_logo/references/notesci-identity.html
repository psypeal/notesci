<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notesci · identity</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink: #0e1116;
    --paper: #f6f4ef;
    --paper-2: #efece5;
    --muted: rgba(14,17,22,.55);
    --rule: rgba(14,17,22,.12);
    --indigo: oklch(0.52 0.22 274);
    --teal:   oklch(0.62 0.14 195);
    --violet: oklch(0.55 0.22 305);
  }
  html,body{margin:0;background:#f0eee9;font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
  .ab{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;}
  .ab.dark{background:var(--ink);color:var(--paper);}
  .ab-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
  .ab-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);font-size:11px;color:var(--muted);font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;}
  .ab.dark .ab-foot{border-top-color:rgba(255,255,255,.1);color:rgba(255,255,255,.5);}
  .corner-tag{position:absolute;top:12px;left:16px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.08em;color:var(--muted);}
  .ab.dark .corner-tag{color:rgba(255,255,255,.5);}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--rule) 1px, transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:24px 24px;opacity:.35;pointer-events:none;}
  /* spinner anim */
  @keyframes nspin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{ opacity:.4; r:5; } 50%{ opacity:1; r:7; } }
  .spin-host{ animation: nspin 2.4s linear infinite; transform-origin: 48px 48px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mark.jsx"></script>
<script type="text/babel" src="identity.jsx"></script>
</body>
</html>
