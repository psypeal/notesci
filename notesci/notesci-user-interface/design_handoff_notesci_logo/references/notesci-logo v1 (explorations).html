<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notesci · logo explorations</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink: #0e1116;
    --ink-2: #1b1f27;
    --paper: #f6f4ef;
    --paper-2: #efece5;
    --rule: rgba(14,17,22,.12);
    --muted: rgba(14,17,22,.55);
    /* shared chroma/lightness, varying hue */
    --indigo: oklch(0.52 0.22 274);
    --indigo-soft: oklch(0.92 0.06 274);
    --teal: oklch(0.62 0.14 195);
    --teal-soft: oklch(0.92 0.05 195);
    --violet: oklch(0.55 0.22 305);
    --violet-soft: oklch(0.93 0.06 305);
    --lime: oklch(0.78 0.18 130);
  }
  html,body{margin:0;background:#f0eee9;font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
  /* Per-artboard styles */
  .ab{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;}
  .ab-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:36px;}
  .ab-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--rule);font-size:11px;color:var(--muted);font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.04em;}
  .ab-foot .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle;}
  .lockup{display:flex;align-items:center;gap:14px;}
  .lockup .word{font-size:38px;letter-spacing:-0.025em;font-weight:600;color:var(--ink);}
  .lockup .word .sci{color:var(--muted);font-weight:500;}
  .grid-bg{
    position:absolute;inset:0;background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size:24px 24px;
    opacity:.35;
    pointer-events:none;
  }
  .swatches{display:flex;gap:6px;align-items:center;}
  .sw{width:14px;height:14px;border-radius:3px;}
  .corner-tag{position:absolute;top:14px;left:18px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.08em;color:var(--muted);}
  .corner-meta{position:absolute;top:14px;right:18px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.04em;color:var(--muted);}

  /* Reused note */
  .note h2{font-family:"Inter Tight";font-weight:600;letter-spacing:-0.02em;margin:0 0 8px;font-size:15px;}
  .note p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:#3a342c;}
  .note .kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:4px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logos.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
