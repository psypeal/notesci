<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notesci · human prompt block · V2 Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1116;
    --rule-2:rgba(14,17,22,.18);
    --indigo:oklch(0.52 0.22 274);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .serif{font-family:"Source Serif 4",ui-serif,Georgia,serif;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:64px;padding:80px 24px;}
  .stage > section{width:100%;max-width:840px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .stage .caption{font-size:11px;letter-spacing:.12em;color:rgba(14,17,22,.5);text-transform:uppercase;font-family:ui-monospace,monospace;}
</style>
</head>
<body>
  <main class="stage">
    <section>
      <div class="caption">SINGLE LINE</div>
      <div id="single"></div>
    </section>
    <section>
      <div class="caption">MULTI LINE</div>
      <div id="multi"></div>
    </section>
  </main>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="quote-block.jsx"></script>
  <script type="text/babel">
    const { QuoteBlock } = window;
    ReactDOM.createRoot(document.getElementById("single")).render(
      <QuoteBlock text="Where do induction heads emerge in small models?"/>
    );
    ReactDOM.createRoot(document.getElementById("multi")).render(
      <QuoteBlock text="Compare how Olsson '22 and Wang '23 characterize the role of induction heads — and where the working-memory framing in Cowan '17 pushes against either."/>
    );
  </script>
</body>
</html>
