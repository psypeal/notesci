<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notesci · general chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1116; --ink-2:#2a2e36;
    --paper:#f6f4ef; --paper-2:#efece5; --paper-3:#e9e6df;
    --rule:rgba(14,17,22,.10); --rule-2:rgba(14,17,22,.18);
    --muted:rgba(14,17,22,.55); --muted-2:rgba(14,17,22,.40);
    --indigo:oklch(0.52 0.22 274); --indigo-soft:oklch(0.92 0.05 274);
    --teal:oklch(0.62 0.14 195);   --teal-soft:oklch(0.92 0.05 195);
    --warn:oklch(0.72 0.16 60);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper-3);font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;}
  .serif{font-family:"Source Serif 4",ui-serif,Georgia,serif;}
  .ns-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);font:inherit;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;}
  .ns-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule-2);}
  .ns-btn:disabled{opacity:.5;cursor:not-allowed;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:4px;}
  @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="mark.jsx"></script>
  <script type="text/babel" src="ws-icons.jsx"></script>
  <script type="text/babel" src="gen-data.jsx"></script>
  <script type="text/babel" src="gen-atoms.jsx"></script>
  <script type="text/babel" src="gen-shell.jsx"></script>
  <script type="text/babel" src="gen-landing.jsx"></script>
  <script type="text/babel" src="gen-chat.jsx"></script>
  <script type="text/babel" src="gen-promote.jsx"></script>
  <script type="text/babel" src="gen-app.jsx"></script>
</body>
</html>
