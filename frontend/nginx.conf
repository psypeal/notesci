# nginx for the notesci frontend container.
#
# - SPA: any unknown path falls back to /index.html so react-router
#   handles client-side routes (deep links work after refresh).
# - /api/* is proxied to the backend service (Compose-DNS name `backend`).
# - /healthz is a 200 for the container/Vultr health probe.
# - Static assets get a cache-forever immutable Cache-Control because
#   Vite's filenames are content-hashed (e.g. index-Bn_UWQfk.css). The
#   index.html itself stays uncached so users get the latest bundle on
#   the next page load.

upstream notesci_backend {
  server backend:8000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  # Don't leak version info.
  server_tokens off;

  # Reasonable upload cap for /materials/ingest-pdf (50MB backend cap).
  client_max_body_size 60m;

  root /usr/share/nginx/html;
  index index.html;

  # ----- Baseline security headers -----
  # CSP: self-hosted scripts only (no inline <script>), Google Fonts
  # whitelisted for the editorial type stack, blob: + data: for the
  # PDF reader's worker URL + inline svg sprites. `frame-ancestors
  # 'none'` plus the legacy `X-Frame-Options DENY` keeps the app out
  # of iframes (clickjacking defense).
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # Opt out of FLoC / Topics so we don't leak browsing-context to ad
  # networks even by accident.
  add_header Permissions-Policy "interest-cohort=(), browsing-topics=()" always;

  # Container/external health probe.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Fingerprinted assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # nginx's default mime.types ships .js but NOT .mjs — without this,
    # Vite's ESM worker chunk (pdf.worker.min-*.mjs in particular) is
    # served as `application/octet-stream`. With `X-Content-Type-Options:
    # nosniff` set above, the browser then refuses to use the response
    # as a module worker, pdf.js falls back to its in-page "fake
    # worker", and the PDF reader stays at "Page 1 / 0" with no
    # canvas. Map .mjs → application/javascript explicitly. The other
    # entries restore common asset types since a `types { … }` block
    # *replaces* the inherited mime mapping for this location.
    types {
      application/javascript js mjs;
      text/css                css;
      image/svg+xml           svg;
      application/wasm        wasm;
      font/woff2              woff2;
      font/woff               woff;
      image/png               png;
      image/jpeg              jpg jpeg;
      image/x-icon            ico;
      application/json        json map;
    }
    try_files $uri =404;
  }

  # Backend reverse proxy. Strip the /api prefix so the backend sees
  # the same URLs as in dev (Vite proxy does the same rewrite).
  location /api/ {
    proxy_pass http://notesci_backend/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Forward the real client IP so the per-IP rate limiter uses it.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long timeout for /chat (LLM round-trips can take 30–60s).
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # SSE (chat/stream) needs streaming + no buffering.
    proxy_buffering off;
    proxy_cache off;
  }

  # SPA fallback — react-router owns history.
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
