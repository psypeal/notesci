[project]
name = "notesci-backend"
version = "0.1.34"
description = "notesci backend — research-grounded chat workspace API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-text-splitters>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pypdf>=5.0",
    "trafilatura>=1.12",
    "langchain-deepseek>=1.0.1",
    "uv>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notesci"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
