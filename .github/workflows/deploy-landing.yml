# Auto-deploy the notesci.com landing site on every push to main.
#
# notesci.com is served by a single Cloudflare module Worker
# (green-sunset-4304) that embeds the landing files and routes by path —
# NOT a Pages project. This workflow rebuilds worker.mjs from landing/
# (packaging/build-landing-worker.py) and PUTs it to that Worker via the
# Cloudflare API. Custom domains (notesci.com + www) are bound to the
# Worker service, so they're preserved across deploys.
#
# ── One-time setup ──
#   Secret CLOUDFLARE_API_TOKEN   token with Account › Workers Scripts › Edit
#   Secret CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
# (See cloudflare-setting/landing-deploy.md.)

name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - 'packaging/build-landing-worker.py'
      - 'packaging/test-landing-worker.mjs'
      - 'packaging/verify-landing-live.py'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notesci-landing-production
  cancel-in-progress: false

env:
  CF_WORKER: green-sunset-4304
  CF_COMPAT_DATE: '2026-05-01'

jobs:
  deploy:
    name: Build + deploy landing Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build worker.mjs from landing/
        run: |
          python3 packaging/build-landing-worker.py landing build/worker.mjs
          node --check build/worker.mjs
          node packaging/test-landing-worker.mjs

      - name: Deploy to Cloudflare Workers
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --max-time 60 -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${CF_WORKER}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "metadata={\"main_module\":\"worker.mjs\",\"compatibility_date\":\"${CF_COMPAT_DATE}\"};type=application/json" \
            -F 'worker.mjs=@build/worker.mjs;filename=worker.mjs;type=application/javascript+module')
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('success'), d; r=d['result']; print('deployed', r['id'], r['modified_on'])"

      - name: Verify live site
        run: |
          for attempt in 1 2 3; do
            if python3 packaging/verify-landing-live.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
