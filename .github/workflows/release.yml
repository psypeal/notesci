# Multi-platform release builds — notesci.
#
# Triggered on push of a `v*` tag (e.g. `v0.1.0`) or manually. Builds:
#   - Linux:   .deb, .rpm (plus best-effort .AppImage)
#   - macOS:   .dmg (universal — bundle includes PG + pgvector dylib)
#   - Windows: .exe NSIS installer (bundle includes PG + pgvector dll)
#
# Each job is independent; failures don't block the others. Artifacts
# are uploaded to the run and attached to the GitHub Release matching
# the tag.
#
# Code signing is deferred (see packaging/cross-platform.md "Open
# questions") — unsigned builds trigger Gatekeeper / SmartScreen
# warnings users have to click through on first launch.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0); only used by manual runs'
        required: false
        default: ''

env:
  PG_VERSION: "16.4"
  PGVECTOR_VERSION: "0.8.0"
  PNPM_VERSION: "9"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Linux: .deb (no embedded PG), .rpm, best-effort .AppImage (embedded PG)
  # Runs on Ubuntu 24.04 because the desktop package depends on
  # python3.12 and WebKitGTK 4.1, which are native Noble packages.
  # AppImage packaging depends on upstream linuxdeploy AppImage tooling and is
  # intentionally non-blocking until that path is reliable on GitHub runners.
  # ─────────────────────────────────────────────────────────────
  linux:
    name: Linux (deb / rpm / AppImage best-effort)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config \
            rpm fakeroot patchelf \
            libpq-dev git curl unzip
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libfuse2t64
          else
            sudo apt-get install -y --no-install-recommends libfuse2
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install tauri-cli
        run: cargo install --locked tauri-cli --version "^2"

      # The .deb uses SYSTEM Postgres (postgresql-16 + -pgvector are
      # dpkg deps; pg.rs takes Mode::System). bundle.resources is GLOBAL
      # across targets, so build the .deb FIRST — before any pg/ tree is
      # staged — otherwise it would embed PG and flip to Mode::Embedded.
      - name: Build .deb (system Postgres, no embedded pg/)
        run: |
          # resources/{pg,python} hold only .gitkeep here → the .deb stays
          # Mode::System + Installed layout (/opt/notesci). Guard on the
          # actual binaries since the dirs always exist (placeholders keep
          # bundle.resources valid).
          test ! -e desktop/src-tauri/resources/pg/bin/postgres
          test ! -e desktop/src-tauri/resources/python/bin/python3
          cd desktop/src-tauri
          cargo tauri build --bundles deb

      - name: Stage embedded Postgres + Python + backend (linux)
        run: |
          ./packaging/embedded-postgres/fetch-pg.sh linux
          ./packaging/embedded-postgres/build-pgvector.sh build/pg-raw/linux
          ./packaging/embedded-postgres/prune-pg.sh build/pg-raw/linux
          ./packaging/embedded-python/fetch-python.sh linux
          ./packaging/embedded-python/build-backend-bundle.sh linux build/py-raw/linux
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/linux   "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/linux   "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist        "$R/frontend"

      # .rpm embeds PG + Python (Mode::Embedded / Bundled layout).
      - name: Build .rpm (embedded Postgres + Python)
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles rpm

      # AppImage uses linuxdeploy's AppImage binaries, which are brittle on
      # GitHub-hosted Ubuntu runners. Keep attempting it, but do not block
      # the release packages users can install today.
      - name: Build .AppImage (best effort)
        continue-on-error: true
        env:
          # GitHub-hosted Linux runners do not reliably expose FUSE to nested
          # AppImage tooling. Extraction mode avoids a linuxdeploy startup
          # failure while producing the same final bundle.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # macOS: .dmg
  # macos-14 = Apple Silicon. Cross-compile to x86_64 is a follow-up.
  # ─────────────────────────────────────────────────────────────
  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage embedded Postgres + Python + backend (macOS arm64)
        run: |
          # python-build-standalone has no universal2 for 3.12.13, and pip
          # wheels are arch-specific, so this job is arm64-only (macos-14 =
          # Apple Silicon). An x86_64 .dmg needs a parallel macos-13 job
          # running fetch-python.sh macos-x86_64 + --target x86_64-apple-darwin.
          ./packaging/embedded-postgres/fetch-pg.sh macos
          ./packaging/embedded-postgres/build-pgvector.sh build/pg-raw/macos
          ./packaging/embedded-postgres/prune-pg.sh build/pg-raw/macos
          ./packaging/embedded-python/fetch-python.sh macos-arm64
          ./packaging/embedded-python/build-backend-bundle.sh macos-arm64 build/py-raw/macos-arm64
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/macos       "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/macos-arm64 "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle     "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist            "$R/frontend"

      - name: Build Tauri (.dmg, arm64)
        run: |
          cd desktop/src-tauri
          cargo install --locked tauri-cli --version "^2"
          cargo tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # Windows: NSIS .exe installer
  # ─────────────────────────────────────────────────────────────
  windows:
    name: Windows (.exe NSIS)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage embedded Postgres + Python + backend (windows)
        shell: bash
        run: |
          ./packaging/embedded-postgres/fetch-pg.sh windows
          # pgvector Windows build runs separately — uses MSVC, not pgxs.
          ./packaging/embedded-python/fetch-python.sh windows
          ./packaging/embedded-python/build-backend-bundle.sh windows build/py-raw/windows
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/windows   "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/windows   "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle   "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist          "$R/frontend"

      - name: Build pgvector (Windows / MSVC)
        shell: pwsh
        run: |
          # build-pgvector-win.ps1 self-bootstraps the x64 MSVC env via
          # vswhere -> vcvars64 (windows-2022 ships VS2022 + the x64 C++
          # toolset), then nmake /F Makefile.win [install] against the
          # staged tree. It throws (fails the job) if the build breaks —
          # no more silently shipping Windows without embeddings.
          ./packaging/embedded-postgres/build-pgvector-win.ps1 `
            -PgRoot "desktop/src-tauri/resources/pg" `
            -PgvectorRef "v$env:PGVECTOR_VERSION"

      - name: Validate Windows embedded Postgres bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pg = "desktop/src-tauri/resources/pg"
          $required = @(
            "bin/postgres.exe",
            "bin/initdb.exe",
            "bin/pg_ctl.exe",
            "bin/psql.exe",
            "bin/icudt67.dll",
            "bin/icuin67.dll",
            "bin/icuuc67.dll",
            "bin/libpq.dll",
            "bin/libssl-3-x64.dll",
            "bin/libcrypto-3-x64.dll",
            "bin/libxml2.dll",
            "bin/zlib1.dll",
            "lib/vector.dll",
            "share/extension/vector.control"
          )
          foreach ($rel in $required) {
            $path = Join-Path $pg $rel
            if (-not (Test-Path -LiteralPath $path)) {
              Get-ChildItem -LiteralPath (Join-Path $pg "bin") | Select-Object Name, Length | Format-Table | Out-String | Write-Host
              throw "Missing Windows embedded Postgres artifact: $path"
            }
          }
          & (Join-Path $pg "bin/postgres.exe") -V
          if ($LASTEXITCODE -ne 0) {
            throw "postgres.exe -V failed with exit code $LASTEXITCODE"
          }

      - name: Build Tauri (.exe NSIS)
        shell: pwsh
        run: |
          cd desktop\src-tauri
          cargo install --locked tauri-cli --version "^2"
          cargo tauri build --bundles nsis

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $installDir = Join-Path $env:LOCALAPPDATA "notesci"
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          function Install-Notesci([string] $Label) {
            Write-Host "Installing notesci ($Label) from $($installer.FullName)"
            $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "silent install failed during ${Label} with exit code $($proc.ExitCode)"
            }
          }

          function Assert-InstalledBundle {
            $required = @(
              "notesci.exe",
              "pg/bin/postgres.exe",
              "pg/bin/initdb.exe",
              "pg/bin/pg_ctl.exe",
              "pg/bin/psql.exe",
              "pg/bin/icudt67.dll",
              "pg/bin/icuin67.dll",
              "pg/bin/icuuc67.dll",
              "pg/bin/libpq.dll",
              "pg/bin/libssl-3-x64.dll",
              "pg/bin/libcrypto-3-x64.dll",
              "pg/bin/libxml2.dll",
              "pg/bin/zlib1.dll",
              "pg/lib/vector.dll",
              "pg/share/extension/vector.control",
              "python/python.exe",
              "backend/src/notesci/main.py",
              "backend/src/notesci/serve.py",
              "frontend/index.html"
            )
            foreach ($rel in $required) {
              $path = Join-Path $installDir $rel
              if (-not (Test-Path -LiteralPath $path)) {
                Get-ChildItem -LiteralPath $installDir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
                throw "Missing installed artifact: $path"
              }
            }

            & (Join-Path $installDir "pg/bin/postgres.exe") -V
            if ($LASTEXITCODE -ne 0) {
              throw "installed postgres.exe -V failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "pg/bin/initdb.exe") --version
            if ($LASTEXITCODE -ne 0) {
              throw "installed initdb.exe --version failed with exit code $LASTEXITCODE"
            }

            $env:PYTHONPATH = Join-Path $installDir "backend/src"
            & (Join-Path $installDir "python/python.exe") -c "import uvicorn; import notesci.main; print('backend import OK')"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend import failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "python/python.exe") -m notesci.serve --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend launcher failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "python/python.exe") -m notesci.serve --check-event-loop | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend event loop check failed with exit code $LASTEXITCODE"
            }
          }

          function Get-NotesciRuntimeProcesses {
            $root = [System.IO.Path]::GetFullPath($installDir).TrimEnd('\', '/')
            Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath).StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)
            }
          }

          Install-Notesci "clean install"
          Assert-InstalledBundle

          $pgData = Join-Path $env:TEMP "notesci-upgrade-pgdata"
          $pgLog = Join-Path $env:TEMP "notesci-upgrade-pg.log"
          Remove-Item -LiteralPath $pgData -Recurse -Force -ErrorAction SilentlyContinue
          & (Join-Path $installDir "pg/bin/initdb.exe") `
            -D $pgData `
            --username notesci `
            --encoding UTF8 `
            --no-locale `
            --auth-local=trust `
            --auth-host=trust
          if ($LASTEXITCODE -ne 0) {
            throw "upgrade smoke initdb failed with exit code $LASTEXITCODE"
          }

          & (Join-Path $installDir "pg/bin/pg_ctl.exe") `
            -D $pgData `
            -l $pgLog `
            -o "-p 55439 -h 127.0.0.1" `
            -w start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $pgLog) {
              Get-Content -LiteralPath $pgLog | Write-Host
            }
            throw "upgrade smoke pg_ctl start failed with exit code $LASTEXITCODE"
          }

          $pythonLock = Start-Process `
            -FilePath (Join-Path $installDir "python/python.exe") `
            -ArgumentList '-c "import time; time.sleep(300)"' `
            -PassThru
          Start-Sleep -Seconds 2
          $pythonLock.Refresh()

          $runtimeProcesses = @(Get-NotesciRuntimeProcesses)
          if (-not ($runtimeProcesses | Where-Object { $_.ExecutablePath -like "*\pg\bin\postgres.exe" })) {
            throw "upgrade smoke did not start installed postgres.exe"
          }
          if ($pythonLock.HasExited) {
            throw "upgrade smoke python.exe lock process exited early with code $($pythonLock.ExitCode)"
          }

          Install-Notesci "upgrade while runtime files are locked"

          $pythonLock.Refresh()
          if (-not $pythonLock.HasExited) {
            Stop-Process -Id $pythonLock.Id -Force -ErrorAction SilentlyContinue
            throw "installer did not stop the installed python.exe lock process before upgrade"
          }

          $leftovers = @(Get-NotesciRuntimeProcesses)
          if ($leftovers.Count -gt 0) {
            $leftovers | Select-Object ProcessId, ExecutablePath, CommandLine | Format-Table | Out-String | Write-Host
            throw "installer did not stop all NoteSci runtime processes before upgrade"
          }
          Assert-InstalledBundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # Attach all bundles to the GitHub Release. Manual runs now synthesize a
  # release tag automatically so artifacts are published without extra steps.
  # ─────────────────────────────────────────────────────────────
  release:
    name: Attach to Release
    # Always attach artifacts after successful platform builds. For manual runs,
    # a tag is synthesized from the provided version input or fallback run id.
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="dev-${GITHUB_RUN_ID}"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) TAG="$VERSION" ;;
            *) TAG="v$VERSION" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/linux-bundles/**/*
            artifacts/macos-dmg/**/*
            artifacts/windows-nsis/**/*
