# Multi-platform release builds — notesci.
#
# Triggered on push of a `v*` tag (e.g. `v0.1.0`) or manually. Builds:
#   - Linux:   .deb, .rpm (plus best-effort .AppImage)
#   - macOS:   .dmg (universal — bundle includes PG + pgvector dylib)
#   - Windows: .exe NSIS installer (bundle includes PG + pgvector dll)
#
# Each job is independent; failures don't block the others. Artifacts
# are uploaded to the run and attached to the GitHub Release matching
# the tag.
#
# Code signing is deferred (see packaging/cross-platform.md "Open
# questions") — unsigned builds trigger Gatekeeper / SmartScreen
# warnings users have to click through on first launch.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0); only used by manual runs'
        required: false
        default: ''

env:
  PG_VERSION: "16.14"
  PGVECTOR_VERSION: "0.8.0"
  PNPM_VERSION: "9"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  RUST_VERSION: "stable"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Linux: .deb (no embedded PG), .rpm, best-effort .AppImage (embedded PG)
  # Runs on Ubuntu 24.04 because the desktop package depends on
  # python3.12 and WebKitGTK 4.1, which are native Noble packages.
  # AppImage packaging depends on upstream linuxdeploy AppImage tooling and is
  # intentionally non-blocking until that path is reliable on GitHub runners.
  # ─────────────────────────────────────────────────────────────
  linux:
    name: Linux (deb / rpm / AppImage best-effort)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev build-essential pkg-config \
            rpm fakeroot patchelf \
            libpq-dev git curl unzip \
            python3.12 python3.12-venv python3-pip
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends libfuse2t64
          else
            sudo apt-get install -y --no-install-recommends libfuse2
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python packaging tools
        run: python -m pip install --upgrade pip uv

      - name: Cache Cargo build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - name: Cache embedded runtimes
        uses: actions/cache@v4
        with:
          path: |
            build/pg-raw/linux
            build/py-raw/linux
            build/pgvector-src
          key: linux-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('packaging/embedded-postgres/*.sh', 'packaging/embedded-python/*.sh') }}
          restore-keys: |
            linux-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install tauri-cli
        run: cargo install --locked tauri-cli --version "^2"

      # The .deb uses SYSTEM Postgres and the custom /opt/notesci layout.
      # Do not use raw `cargo tauri build --bundles deb`: it omits backend,
      # frontend, wheels, and maintainer scripts needed by installed Linux apps.
      - name: Build .deb (system Postgres, /opt/notesci layout)
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          VERSION="${RELEASE_INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            REF_NAME="${GITHUB_REF_NAME:-}"
            case "$REF_NAME" in
              v*) VERSION="${REF_NAME#v}" ;;
            esac
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(grep -E '^version = ' backend/pyproject.toml | head -1 | cut -d'"' -f2)"
          fi

          # resources/{pg,python} hold only .gitkeep here. The Debian package
          # is assembled by packaging/build-deb.sh, not Tauri resources.
          test ! -e desktop/src-tauri/resources/pg/bin/postgres
          test ! -e desktop/src-tauri/resources/python/bin/python3
          ./packaging/build-deb.sh "$VERSION"

      - name: Assert .deb contains full backend bundle
        run: |
          DEB="$(ls -1 build/notesci_*_amd64.deb | head -1)"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -e "$DEB" "$tmp/DEBIAN"
          dpkg-deb -x "$DEB" "$tmp/root"

          test -x "$tmp/root/opt/notesci/bin/notesci"
          test -L "$tmp/root/usr/bin/notesci"
          test -f "$tmp/root/opt/notesci/backend/src/notesci/main.py"
          test -f "$tmp/root/opt/notesci/frontend/index.html"
          test -f "$tmp/root/opt/notesci/wheels/requirements.txt"
          test -x "$tmp/DEBIAN/postinst"

          wheels="$(find "$tmp/root/opt/notesci/wheels" -name '*.whl' -type f | wc -l)"
          if [ "$wheels" -lt 20 ]; then
            echo "Expected full wheel bundle, found only $wheels wheels" >&2
            exit 1
          fi

          bytes="$(stat -c '%s' "$DEB")"
          if [ "$bytes" -lt 50000000 ]; then
            echo "Debian package is too small for the full dependency bundle: $bytes bytes" >&2
            exit 1
          fi

      - name: Stage embedded Postgres + Python + backend (linux)
        run: |
          ./packaging/embedded-postgres/fetch-pg.sh linux
          ./packaging/embedded-postgres/build-pgvector.sh build/pg-raw/linux
          ./packaging/embedded-postgres/prune-pg.sh build/pg-raw/linux
          ./packaging/embedded-python/fetch-python.sh linux
          ./packaging/embedded-python/build-backend-bundle.sh linux build/py-raw/linux
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/linux   "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/linux   "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist        "$R/frontend"

      # .rpm embeds PG + Python (Mode::Embedded / Bundled layout).
      - name: Build .rpm (embedded Postgres + Python)
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles rpm

      # AppImage uses linuxdeploy's AppImage binaries, which are brittle on
      # GitHub-hosted Ubuntu runners. Keep attempting it, but do not block
      # the release packages users can install today.
      - name: Build .AppImage (best effort)
        continue-on-error: true
        env:
          # GitHub-hosted Linux runners do not reliably expose FUSE to nested
          # AppImage tooling. Extraction mode avoids a linuxdeploy startup
          # failure while producing the same final bundle.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd desktop/src-tauri
          cargo tauri build --bundles appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            build/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # macOS: .dmg
  # macos-14 = Apple Silicon. Cross-compile to x86_64 is a follow-up.
  # ─────────────────────────────────────────────────────────────
  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/src-tauri/target
          key: macos-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            macos-cargo-

      - name: Cache embedded runtimes
        uses: actions/cache@v4
        with:
          path: |
            build/pg-raw/macos
            build/py-raw/macos-arm64
            build/pgvector-src
          key: macos-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('packaging/embedded-postgres/*.sh', 'packaging/embedded-python/*.sh') }}
          restore-keys: |
            macos-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage embedded Postgres + Python + backend (macOS arm64)
        run: |
          # python-build-standalone has no universal2 for 3.12.13, and pip
          # wheels are arch-specific, so this job is arm64-only (macos-14 =
          # Apple Silicon). An x86_64 .dmg needs a parallel macos-13 job
          # running fetch-python.sh macos-x86_64 + --target x86_64-apple-darwin.
          ./packaging/embedded-postgres/fetch-pg.sh macos
          ./packaging/embedded-postgres/build-pgvector.sh build/pg-raw/macos
          ./packaging/embedded-postgres/prune-pg.sh build/pg-raw/macos
          ./packaging/embedded-python/fetch-python.sh macos-arm64
          ./packaging/embedded-python/build-backend-bundle.sh macos-arm64 build/py-raw/macos-arm64
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/macos       "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/macos-arm64 "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle     "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist            "$R/frontend"

      - name: Build Tauri (.dmg, arm64)
        run: |
          cd desktop/src-tauri
          cargo install --locked tauri-cli --version "^2"
          cargo tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # Windows: NSIS .exe installer
  # ─────────────────────────────────────────────────────────────
  windows:
    name: Windows (.exe NSIS)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Cargo build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Cache embedded runtimes
        uses: actions/cache@v4
        with:
          path: |
            build/pg-raw/windows
            build/py-raw/windows
            build/pgvector-src
          key: windows-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('packaging/embedded-postgres/*.sh', 'packaging/embedded-python/*.sh') }}
          restore-keys: |
            windows-embedded-${{ env.PG_VERSION }}-${{ env.PGVECTOR_VERSION }}-${{ env.PYTHON_VERSION }}-

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libxslt
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-postgresql-16

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build pgvector and stage MSYS2 PostgreSQL (windows)
        shell: msys2 {0}
        run: |
          if [[ -f build/pg-raw/windows/bin/postgres.exe \
             && -f build/pg-raw/windows/lib/vector.dll \
             && -f build/pg-raw/windows/share/extension/vector.control \
             && -f build/pg-raw/windows/share/postgresql/extension/pgcrypto.control ]]; then
            echo "Using cached staged Windows PostgreSQL + pgvector"
          else
            ./packaging/embedded-postgres/build-pgcrypto-msys2.sh
            ./packaging/embedded-postgres/build-pgvector-msys2.sh
            ./packaging/embedded-postgres/stage-msys2-pg.sh
          fi

      - name: Stage embedded Postgres + Python + backend (windows)
        shell: bash
        run: |
          ./packaging/embedded-python/fetch-python.sh windows
          ./packaging/embedded-python/build-backend-bundle.sh windows build/py-raw/windows
          R=desktop/src-tauri/resources
          rm -rf "$R/pg"       && cp -r build/pg-raw/windows   "$R/pg"
          rm -rf "$R/python"   && cp -r build/py-raw/windows   "$R/python"
          rm -rf "$R/backend"  && cp -r build/backend-bundle   "$R/backend"
          rm -rf "$R/frontend" && cp -r frontend/dist          "$R/frontend"

      - name: Validate Windows embedded Postgres bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pg = "desktop/src-tauri/resources/pg"
          $required = @(
            "bin/postgres.exe",
            "bin/initdb.exe",
            "bin/pg_ctl.exe",
            "bin/psql.exe",
            "bin/libpq.dll",
            "lib/vector.dll",
            "share/extension/vector.control",
            "share/postgresql/extension/pgcrypto.control"
          )
          foreach ($rel in $required) {
            $path = Join-Path $pg $rel
            if (-not (Test-Path -LiteralPath $path)) {
              Get-ChildItem -LiteralPath (Join-Path $pg "bin") | Select-Object Name, Length | Format-Table | Out-String | Write-Host
              throw "Missing Windows embedded Postgres artifact: $path"
            }
          }
          $dllPatterns = @(
            "libicu*.dll",
            "libssl*.dll",
            "libcrypto*.dll",
            "libxml2*.dll",
            "zlib*.dll"
          )
          foreach ($pattern in $dllPatterns) {
            $matches = Get-ChildItem -LiteralPath (Join-Path $pg "bin") -Filter $pattern -ErrorAction SilentlyContinue
            if (-not $matches) {
              Get-ChildItem -LiteralPath (Join-Path $pg "bin") | Select-Object Name, Length | Format-Table | Out-String | Write-Host
              throw "Missing Windows embedded Postgres runtime DLL matching: bin/$pattern"
            }
          }
          & (Join-Path $pg "bin/postgres.exe") -V
          if ($LASTEXITCODE -ne 0) {
            throw "postgres.exe -V failed with exit code $LASTEXITCODE"
          }

      - name: Build Tauri (.exe NSIS)
        shell: pwsh
        run: |
          cd desktop\src-tauri
          cargo install --locked tauri-cli --version "^2"
          cargo tauri build --bundles nsis

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "NSIS installer was not produced"
          }

          $installDir = Join-Path $env:LOCALAPPDATA "notesci"
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          function Install-Notesci([string] $Label) {
            Write-Host "Installing notesci ($Label) from $($installer.FullName)"
            $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "silent install failed during ${Label} with exit code $($proc.ExitCode)"
            }
          }

          function Assert-InstalledBundle {
            $required = @(
              "notesci.exe",
              "pg/bin/postgres.exe",
              "pg/bin/initdb.exe",
              "pg/bin/pg_ctl.exe",
              "pg/bin/psql.exe",
              "pg/bin/libpq.dll",
              "pg/lib/vector.dll",
              "pg/share/extension/vector.control",
              "pg/share/postgresql/extension/pgcrypto.control",
              "python/python.exe",
              "backend/src/notesci/main.py",
              "backend/src/notesci/serve.py",
              "frontend/index.html"
            )
            foreach ($rel in $required) {
              $path = Join-Path $installDir $rel
              if (-not (Test-Path -LiteralPath $path)) {
                Get-ChildItem -LiteralPath $installDir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
                throw "Missing installed artifact: $path"
              }
            }
            $installedDllPatterns = @(
              "libicu*.dll",
              "libssl*.dll",
              "libcrypto*.dll",
              "libxml2*.dll",
              "zlib*.dll"
            )
            foreach ($pattern in $installedDllPatterns) {
              $matches = Get-ChildItem -LiteralPath (Join-Path $installDir "pg/bin") -Filter $pattern -ErrorAction SilentlyContinue
              if (-not $matches) {
                Get-ChildItem -LiteralPath (Join-Path $installDir "pg/bin") | Select-Object Name, Length | Format-Table | Out-String | Write-Host
                throw "Missing installed Windows Postgres runtime DLL matching: pg/bin/$pattern"
              }
            }

            & (Join-Path $installDir "pg/bin/postgres.exe") -V
            if ($LASTEXITCODE -ne 0) {
              throw "installed postgres.exe -V failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "pg/bin/initdb.exe") --version
            if ($LASTEXITCODE -ne 0) {
              throw "installed initdb.exe --version failed with exit code $LASTEXITCODE"
            }

            $env:PYTHONPATH = Join-Path $installDir "backend/src"
            & (Join-Path $installDir "python/python.exe") -c "import uvicorn; import notesci.main; print('backend import OK')"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend import failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "python/python.exe") -c "import asyncio; import notesci.main; policy = type(asyncio.get_event_loop_policy()).__name__; print('event-loop policy', policy); assert 'WindowsSelector' in policy"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend did not install Windows selector event-loop policy"
            }
            & (Join-Path $installDir "python/python.exe") -m notesci.serve --help | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend launcher failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "python/python.exe") -m notesci.serve --check-event-loop | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python backend event loop check failed with exit code $LASTEXITCODE"
            }
            & (Join-Path $installDir "python/python.exe") -c "import importlib.util, shutil; from notesci.agent.mcp_tools import _stdio_env; env=_stdio_env({}); assert shutil.which('uvx', path=env.get('PATH')) or shutil.which('uv', path=env.get('PATH')) or importlib.util.find_spec('uv'); print('uvx MCP launcher fallback OK')"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python is missing uv for uvx-based MCP fallback"
            }
            & (Join-Path $installDir "python/python.exe") -c "from notesci.agent.mcp_tools import _build_connection; c=_build_connection('stdio', {'command':'uvx','args':['--from','zotero-mcp-server','zotero-mcp','serve','--transport','stdio'],'env':{'ZOTERO_LOCAL':'true'}}); print(c['command'], c['args'][:4]); assert c['transport']=='stdio'; assert c['command'].lower().endswith(('uvx.exe','uv.exe','python.exe')); assert 'PATH' in c['env']"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python could not resolve Zotero uvx MCP stdio launcher"
            }
            & (Join-Path $installDir "python/python.exe") -c "from notesci.agent.mcp_tools import _build_connection; from notesci.mcp_catalog import get_entry; e=get_entry('paper-search'); c=_build_connection(e.transport, e.config); print(c['command'], c['args']); assert c['transport']=='stdio'; assert c['command'].lower().endswith(('npx.cmd','npx.exe','npx')); assert '--package' in c['args']; assert 'node@20' in c['args']; assert 'paper-search-mcp-nodejs' in c['args']"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python could not resolve Paper Search managed Node MCP launcher"
            }
            & (Join-Path $installDir "python/python.exe") -c "from notesci.agent.mcp_tools import _build_connection; from notesci.mcp_catalog import get_entry; e=get_entry('scihub'); c=_build_connection(e.transport, e.config); print(c['command'], c['args']); assert c['transport']=='stdio'; assert c['command'].lower().endswith(('uvx.exe','uv.exe','python.exe')); assert any('github.com/riichard/Sci-Hub-MCP-Server/archive/refs/heads/main.zip' in str(a) for a in c['args']); assert 'sci-hub-mcp' in c['args']; assert '--transport' in c['args'] and 'stdio' in c['args']; assert not any(str(a).startswith('git+') for a in c['args']); assert c['env'].get('PYTHONUTF8') == '1'; assert c['env'].get('SCIHUB_HTTP_CLIENT') == 'requests'; assert c['env'].get('SCIHUB_INCLUDE_DEFAULT_MIRRORS') == 'true'"
            if ($LASTEXITCODE -ne 0) {
              throw "installed bundled Python could not resolve Sci-Hub PyPI MCP launcher"
            }
          }

          function Get-NotesciRuntimeProcesses {
            $root = [System.IO.Path]::GetFullPath($installDir).TrimEnd('\', '/')
            Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath).StartsWith($root, [System.StringComparison]::OrdinalIgnoreCase)
            }
          }

          Install-Notesci "clean install"
          Assert-InstalledBundle

          $pgData = Join-Path $env:TEMP "notesci-upgrade-pgdata"
          $pgLog = Join-Path $env:TEMP "notesci-upgrade-pg.log"
          Remove-Item -LiteralPath $pgData -Recurse -Force -ErrorAction SilentlyContinue
          & (Join-Path $installDir "pg/bin/initdb.exe") `
            -D $pgData `
            --username notesci `
            --encoding UTF8 `
            --no-locale `
            --auth-local=trust `
            --auth-host=trust
          if ($LASTEXITCODE -ne 0) {
            throw "upgrade smoke initdb failed with exit code $LASTEXITCODE"
          }

          & (Join-Path $installDir "pg/bin/pg_ctl.exe") `
            -D $pgData `
            -l $pgLog `
            -o "-p 55439 -h 127.0.0.1" `
            -w start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $pgLog) {
              Get-Content -LiteralPath $pgLog | Write-Host
            }
            throw "upgrade smoke pg_ctl start failed with exit code $LASTEXITCODE"
          }

          & (Join-Path $installDir "pg/bin/psql.exe") `
            -h 127.0.0.1 `
            -p 55439 `
            -U notesci `
            -d postgres `
            -v ON_ERROR_STOP=1 `
            -q `
            -c "CREATE DATABASE notesci OWNER notesci"
          if ($LASTEXITCODE -ne 0) {
            throw "backend startup smoke database creation failed with exit code $LASTEXITCODE"
          }

          $backendOut = Join-Path $env:TEMP "notesci-backend-startup-smoke.out.log"
          $backendErr = Join-Path $env:TEMP "notesci-backend-startup-smoke.err.log"
          Remove-Item -LiteralPath $backendOut -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $backendErr -Force -ErrorAction SilentlyContinue
          $env:PYTHONPATH = Join-Path $installDir "backend/src"
          $env:DATABASE_URL = "postgresql://notesci:notesci_local@127.0.0.1:55439/notesci"
          $env:NOTESCI_STATIC_DIR = Join-Path $installDir "frontend"
          $env:NOTESCI_LOCAL_MODE = "1"
          $env:NOTESCI_LOCAL_TOKEN_PATH = Join-Path $env:TEMP "notesci-smoke-session-token"
          Remove-Item -LiteralPath $env:NOTESCI_LOCAL_TOKEN_PATH -Force -ErrorAction SilentlyContinue
          $backendProc = Start-Process `
            -FilePath (Join-Path $installDir "python/python.exe") `
            -ArgumentList '-m notesci.serve --host 127.0.0.1 --port 18765' `
            -RedirectStandardOutput $backendOut `
            -RedirectStandardError $backendErr `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              $backendProc.Refresh()
              if ($backendProc.HasExited) {
                if (Test-Path -LiteralPath $backendOut) {
                  Get-Content -LiteralPath $backendOut | Write-Host
                }
                if (Test-Path -LiteralPath $backendErr) {
                  Get-Content -LiteralPath $backendErr | Write-Host
                }
                throw "installed backend exited before /readyz with code $($backendProc.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:18765/readyz" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) {
              if (Test-Path -LiteralPath $backendOut) {
                Get-Content -LiteralPath $backendOut | Write-Host
              }
              if (Test-Path -LiteralPath $backendErr) {
                Get-Content -LiteralPath $backendErr | Write-Host
              }
              throw "installed backend did not become ready within 90s"
            }
            Write-Host "Installed backend /readyz smoke passed"

            $tokenResponse = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/auth/local-token" `
              -Method Get `
              -TimeoutSec 10
            if (-not $tokenResponse.token) {
              throw "local auth smoke did not return a token"
            }
            $authHeaders = @{
              Authorization = "Bearer $($tokenResponse.token)"
            }

            $me = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me" `
              -Headers $authHeaders `
              -TimeoutSec 10
            if ($me.email -ne "local@notesci.app") {
              throw "local auth smoke returned unexpected member email: $($me.email)"
            }

            $profile = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me" `
              -Method Patch `
              -Headers $authHeaders `
              -ContentType "application/json" `
              -Body (@{ display_name = "Smoke User" } | ConvertTo-Json -Compress) `
              -TimeoutSec 10
            if ($profile.display_name -ne "Smoke User") {
              throw "profile smoke failed to update display_name"
            }

            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me/provider-keys" `
              -Headers $authHeaders `
              -TimeoutSec 10 | Out-Null
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me/provider-keys/openai" `
              -Method Put `
              -Headers $authHeaders `
              -ContentType "application/json" `
              -Body (@{ api_key = "sk-smoke-test-0000" } | ConvertTo-Json -Compress) `
              -TimeoutSec 10 | Out-Null
            $keyStatus = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me/provider-keys" `
              -Headers $authHeaders `
              -TimeoutSec 10
            $openaiKey = @($keyStatus.keys | Where-Object { $_.provider_id -eq "openai" })[0]
            if (-not $openaiKey -or -not $openaiKey.set -or $openaiKey.last4 -ne "0000") {
              throw "provider key smoke failed to save and reflect OpenAI key status"
            }
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/me/provider-keys/openai" `
              -Method Delete `
              -Headers $authHeaders `
              -TimeoutSec 10 | Out-Null
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/providers/available" `
              -Headers $authHeaders `
              -TimeoutSec 10 | Out-Null
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/mcp/catalog" `
              -Headers $authHeaders `
              -TimeoutSec 10 | Out-Null
            Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/system/tools" `
              -Headers $authHeaders `
              -TimeoutSec 10 | Out-Null

            $createdProject = Invoke-RestMethod `
              -Uri "http://127.0.0.1:18765/api/projects" `
              -Method Post `
              -Headers $authHeaders `
              -ContentType "application/json" `
              -Body (@{ name = "Smoke Project" } | ConvertTo-Json -Compress) `
              -TimeoutSec 10
            if (-not $createdProject.id) {
              throw "project smoke did not create a project"
            }
            Write-Host "Installed backend local-mode authenticated API smoke passed"
          } catch {
            if (Test-Path -LiteralPath $backendOut) {
              Get-Content -LiteralPath $backendOut | Write-Host
            }
            if (Test-Path -LiteralPath $backendErr) {
              Get-Content -LiteralPath $backendErr | Write-Host
            }
            throw
          } finally {
            if ($backendProc -and -not $backendProc.HasExited) {
              Stop-Process -Id $backendProc.Id -Force -ErrorAction SilentlyContinue
              $backendProc.WaitForExit(10000) | Out-Null
            }
          }

          $pythonLock = Start-Process `
            -FilePath (Join-Path $installDir "python/python.exe") `
            -ArgumentList '-c "import time; time.sleep(300)"' `
            -PassThru
          Start-Sleep -Seconds 2
          $pythonLock.Refresh()

          $runtimeProcesses = @(Get-NotesciRuntimeProcesses)
          if (-not ($runtimeProcesses | Where-Object { $_.ExecutablePath -like "*\pg\bin\postgres.exe" })) {
            throw "upgrade smoke did not start installed postgres.exe"
          }
          if ($pythonLock.HasExited) {
            throw "upgrade smoke python.exe lock process exited early with code $($pythonLock.ExitCode)"
          }

          Install-Notesci "upgrade while runtime files are locked"

          $pythonLock.Refresh()
          if (-not $pythonLock.HasExited) {
            Stop-Process -Id $pythonLock.Id -Force -ErrorAction SilentlyContinue
            throw "installer did not stop the installed python.exe lock process before upgrade"
          }

          $leftovers = @(Get-NotesciRuntimeProcesses)
          if ($leftovers.Count -gt 0) {
            $leftovers | Select-Object ProcessId, ExecutablePath, CommandLine | Format-Table | Out-String | Write-Host
            throw "installer did not stop all NoteSci runtime processes before upgrade"
          }
          Assert-InstalledBundle

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # Attach all bundles to the GitHub Release. Manual runs now synthesize a
  # release tag automatically so artifacts are published without extra steps.
  # ─────────────────────────────────────────────────────────────
  release:
    name: Attach to Release
    # Always attach artifacts after successful platform builds. For manual runs,
    # a tag is synthesized from the provided version input or fallback run id.
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="dev-${GITHUB_RUN_ID}"
            fi
          fi
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          case "$VERSION" in
            v*) TAG="$VERSION" ;;
            *) TAG="v$VERSION" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/linux-bundles/**/*
            artifacts/macos-dmg/**/*
            artifacts/windows-nsis/**/*
