[package]
name = "notesci"
version = "0.1.32"
description = "notesci — personal research workspace (desktop)"
authors = ["notesci maintainers"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 expects a library crate; the binary in src/main.rs just
# delegates to lib.rs::run() so commands can be unit-tested without
# spinning up a real Tauri app.
[lib]
name = "notesci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` enables the TrayIconBuilder + Menu APIs we need to wire
# the system-tray indicator (top-bar on GNOME, system-tray on KDE /
# Windows). On Linux this transitively depends on libappindicator /
# libayatana-appindicator at runtime — the .deb declares both as
# Depends so install-time resolution covers either flavour.
# `unstable` enables the multi-webview API (Window::add_child / get_webview)
# used to embed the in-app source preview as a native webview overlaid on
# the review modal's content area — see embed_preview in lib.rs.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backend lifecycle — spawning the Python uvicorn subprocess, waiting
# for "Application startup complete", forwarding stdout/stderr, killing
# on Tauri exit. The std library + Tauri's runtime are enough for now;
# tokio comes in transitively through tauri.
log = "0.4"
env_logger = "0.11"
# Native file save dialog. WebKitGTK doesn't honour the HTML <a download>
# attribute on blob URLs reliably — clicks fall through with no dialog
# — so the Export button in the PDF reader invokes a Rust command that
# pops the OS's native save-as via rfd and writes the bytes.
rfd = { version = "0.15", default-features = false, features = ["gtk3", "common-controls-v6"] }

# Release profile — strip + optimize for smaller .deb.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
